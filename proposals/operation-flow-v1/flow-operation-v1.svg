<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="flowTitle flowDesc">
<title id="flowTitle">DESSET: del pedido a la entrega</title>
<desc id="flowDesc">Secuencia conceptual: el cliente solicita, el comercio prepara, un repartidor recoge y el cliente recibe. Control supervisa el proceso. Animación ilustrativa, no seguimiento real.</desc>
<style><![CDATA[
  .mono{font-family:Consolas,Menlo,"Liberation Mono",monospace}
  .stage{font-size:18px;font-weight:800;letter-spacing:-.7px}
  .sub{font-size:12px;font-weight:700;letter-spacing:.5px}
  .count{font-size:12px;font-weight:800}
  .route-trace{stroke:#ffb800;stroke-width:5;stroke-linecap:round;stroke-dasharray:8 18;animation:trace 1.2s linear infinite}
  .parcel{offset-path:path("M103 238 C176 238 203 205 263 205 S363 270 445 270 S548 214 627 214");offset-distance:0%;offset-rotate:0deg;animation:parcel-travel 8s cubic-bezier(.32,.04,.72,.96) infinite}
  .signal{transform-box:fill-box;transform-origin:center;animation:signal-pulse 2.5s ease-in-out infinite}
  @keyframes trace{to{stroke-dashoffset:-52}}
  @keyframes parcel-travel{0%{offset-distance:0%;opacity:1}85%{offset-distance:100%;opacity:1}92%{offset-distance:100%;opacity:1}100%{offset-distance:100%;opacity:0}}
  @keyframes signal-pulse{0%,100%{opacity:.25;transform:scale(.82)}50%{opacity:.75;transform:scale(1.25)}}
  @media (prefers-reduced-motion:reduce){.route-trace,.parcel,.signal{animation:none}.parcel{offset-distance:58%;opacity:1}.signal{opacity:.28}}
]]></style>
