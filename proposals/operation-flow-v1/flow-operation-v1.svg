  <circle cx="24" cy="23" r="5" fill="#FF3328"/>
  <text x="43" y="21" font-size="13" font-weight="800" fill="white">CONTROL</text>
  <text x="43" y="35" font-size="10" fill="#DDD">SUPERVISA EL FLUJO</text>
</g>
