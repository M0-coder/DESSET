<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460" role="img" aria-labelledby="mobileFlowTitle mobileFlowDesc">
<title id="mobileFlowTitle">DESSET: recorrido de un pedido en cuatro etapas</title>
<desc id="mobileFlowDesc">Vista de teléfono: 01 Cliente solicita; 02 Comercio prepara; 03 Repartidor recoge; 04 Cliente recibe. Control supervisa el recorrido. Dibujo conceptual animado, no seguimiento de pedidos reales.</desc>
<style><![CDATA[
 .mono{font-family:Consolas,Menlo,"Liberation Mono",monospace}
 .count{font-size:17px;font-weight:800}
 .name{font-size:23px;font-weight:900;letter-spacing:-.7px}
 .action{font-size:18px;font-weight:700}
 .active{stroke:#FF3328;stroke-width:5;stroke-dasharray:8 12;animation:dash 1.1s linear infinite}
 .token{offset-path:path("M165 164H194 M274 223V245 M194 318H165");offset-distance:0%;offset-rotate:0deg;animation:move 6.5s ease-in-out infinite}
 .pulse{animation:pulse 2s ease-in-out infinite}
 @keyframes dash{to{stroke-dashoffset:-40}}
 @keyframes move{0%{offset-distance:0%;opacity:1}85%{offset-distance:100%;opacity:1}100%{offset-distance:100%;opacity:.2}}
 @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.active,.token,.pulse{animation:none}.token{opacity:0}.pulse{opacity:.6}}
]]></style>
<rect width="360" height="460" fill="#F0EEEA"/>
<g fill="none" stroke="#D0CDC8" stroke-width="1.5" opacity=".65">
 <path d="M0 78H360M0 227H360M0 409H360M10 55V418M179 55V418M350 55V418" stroke-dasharray="5 8"/>
 <path d="M0 368L68 351 166 387 267 353 360 370"/>
</g>
<g class="mono">
 <rect x="17" y="19" width="326" height="45" rx="11" fill="#1E1E1E"/>
 <rect x="17" y="19" width="6" height="45" rx="3" fill="#FF3328"/>
 <circle class="pulse" cx="42" cy="41" r="7" fill="#FF3328"/>
 <text x="60" y="39" fill="white" font-size="17" font-weight="800">CONTROL</text>
 <text x="60" y="54" fill="white" font-size="12">SUPERVISA LA OPERACIÓN</text>
</g>
<g stroke-linecap="round" fill="none">
 <path d="M165 164H194M274 223V245M194 318H165" stroke="#1E1E1E" stroke-width="13" opacity=".15"/>
 <path d="M165 164H194M274 223V245M194 318H165" stroke="#fff" stroke-width="10"/>
 <path class="active" d="M165 164H194M274 223V245M194 318H165"/>
</g>
<g class="mono">
 <g transform="translate(15 94)">
  <rect width="151" height="128" rx="14" fill="#1551D8"/>
  <text class="count" x="13" y="25" fill="white">01 / CLIENTE</text>
  <g stroke="white" stroke-width="3" fill="none" transform="translate(62 35)"><rect width="25" height="36" rx="4"/><path d="M7 29h11M7 6h11"/></g>
  <text class="name" x="13" y="91" fill="white">PEDIDO</text>
  <text class="action" x="13" y="115" fill="white">SOLICITA</text>
 </g>
 <g transform="translate(193 94)">
  <rect width="152" height="128" rx="14" fill="#FFC62F"/>
  <text class="count" x="13" y="25" fill="#111">02 / BUSINESS</text>
  <g stroke="#111" stroke-width="3" fill="none" transform="translate(61 39)"><path d="M0 11h29v28H0zM-4 11l7-12h23l7 12M10 39V24h9v15"/></g>
  <text class="name" x="13" y="91" fill="#111">COMERCIO</text>
  <text class="action" x="13" y="115" fill="#111">PREPARA</text>
 </g>
 <g transform="translate(193 243)">
  <rect width="152" height="131" rx="14" fill="#111"/>
  <text class="count" x="13" y="25" fill="white">03 / RIDER</text>
  <g fill="none" stroke="white" stroke-width="3" transform="translate(51 43)"><circle cx="5" cy="23" r="8"/><circle cx="46" cy="23" r="8"/><path d="M5 23l14-17h14l13 17M19 6l-6-7h14"/></g>
  <text class="name" x="13" y="94" fill="white">REPARTO</text>
  <text class="action" x="13" y="118" fill="white">RECOGE</text>
 </g>
 <g transform="translate(15 243)">
  <rect width="151" height="131" rx="14" fill="#1551D8"/>
  <text class="count" x="13" y="25" fill="white">04 / CLIENTE</text>
  <g fill="none" stroke="white" stroke-width="3" stroke-linejoin="round" transform="translate(57 38)"><path d="M0 10l20-8 20 8v29l-20 8L0 39zM0 10l20 9 20-9M20 19v27"/><path d="M8 29l10 10 17-21"/></g>
  <text class="name" x="13" y="94" fill="white">ENTREGA</text>
  <text class="action" x="13" y="118" fill="white">RECIBE</text>
 </g>
</g>
<g class="token"><circle r="7" fill="#FF3328" stroke="#fff" stroke-width="3"/></g>
<text class="mono" x="20" y="420" fill="#333" font-size="14" font-weight="700">ESQUEMA PREVISTO · NO OPERACIÓN EN VIVO</text>
</svg>