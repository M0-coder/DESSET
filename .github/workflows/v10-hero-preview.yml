name: DESSET V10 Hero Candidate Preview (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - styles.css
      - tests/hero-v10-preview.test.mjs
      - docs/V10-HERO-PILOT.md
      - .github/workflows/v10-hero-preview.yml
permissions:
  contents: read
jobs:
  hero-preview:
    if: github.head_ref == 'design/v10-hero-pilot-no-deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout candidate (not production)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Ensure the production approval gate rejects this unapproved CSS
        run: |
          if node scripts/approved-baseline-gate.mjs >/tmp/desset-v10-gate.txt 2>&1; then
            echo "::error::Unexpected baseline PASS; candidate must remain unapproved"
            exit 1
          fi
          grep -Fq "BENTO NO APROBADO" /tmp/desset-v10-gate.txt || {
            cat /tmp/desset-v10-gate.txt
            exit 1
          }
          echo "PASS: production approval gate remains fail-closed on candidate"
      - name: Syntax, candidate and general unit tests (except baseline-approval unit assertions)
        shell: bash
        run: |
          node --check src/app.mjs
          node --check src/content.mjs
          mapfile -t suites < <(find tests -maxdepth 1 -type f -name '*.test.mjs' ! -name 'visual-baseline.test.mjs' | LC_ALL=C sort)
          node --test "${suites[@]}"
          node scripts/verify.mjs
      - name: Security static audit
        run: npm run security:audit
      - name: Mutation smoke and partial candidate coverage
        shell: bash
        run: |
          npm run mutation:smoke
          mapfile -t suites < <(find tests -maxdepth 1 -type f -name '*.test.mjs' ! -name 'visual-baseline.test.mjs' | LC_ALL=C sort)
          node --experimental-test-coverage --test "${suites[@]}"
      - name: Chrome available
        run: google-chrome --version
      - name: Browser regression on 13 sizes (preview only)
        run: npm run browser:audit
      - name: Collect local screenshots; never publish
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desset-v10-hero-preview-evidence
          path: reports/browser/
          if-no-files-found: warn
          retention-days: 14
# PREVIEW is separate from approval. The unchanged main CI baseline tests
# and manual Cloudflare release workflow remain mandatory for promotion.
