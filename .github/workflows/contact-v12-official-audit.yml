name: DESSET CONTACT-V12 - Official Candidate Browser Audit (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "scripts/contact-v12-browser.mjs"
      - ".github/workflows/contact-v12-official-audit.yml"
permissions:
  contents: read
jobs:
  local-contact-review:
    name: contact-v12-browser-readonly
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout candidate only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Node 22 pinned
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Reproducible local installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Source-contract tests of contact implementation
        run: |
          node --check scripts/contact-v12-browser.mjs
          node --test tests/contact-v12-integration.test.mjs
      - name: Validate unsigned proposal and exact candidate SHA256 (no authorization)
        run: |
          node --test tests/contact-v12-approval-proposal.test.mjs
          node scripts/contact-v12-approval-proposal.mjs
      - name: Static security and role mutation smoke (local only)
        run: |
          node scripts/verify.mjs
          npm run security:audit
          npm run mutation:smoke
          node --test tests/visual-approval.test.mjs tests/browser-cleanup.test.mjs
      - name: Cloudflare preview safety and negative package controls (local only)
        env:
          DESSET_CLOUDFLARE_STAGE: "LOCAL_TEST_ONLY"
          DESSET_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run cloudflare:negative
          npm run cloudflare:stage
          npm run cloudflare:gate
      - name: Instrumented Chrome audit with 26 captures and no deployment
        run: |
          google-chrome --version
          node scripts/contact-v12-browser.mjs
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desset-contact-v12-official-candidate-evidence
          path: reports/contact-v12-implementation/
          if-no-files-found: warn
          retention-days: 14
