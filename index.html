<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8e7e5">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="DELIVER ASSETS / DESSET. Sitio institucional en desarrollo. Proyecto de comercio y coordinación de entregas en preparación.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>DELIVER ASSETS · Proyecto en desarrollo</title>
  <link rel="icon" type="image/png" href="./assets/deliver-assets-mark.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/app.mjs"></script>
</head>
<body data-theme="light">
  <div class="site">
    <main class="board" id="board" data-view="home" aria-label="Inicio de DELIVER ASSETS">
      <section class="tile tile--intro" aria-labelledby="main-heading">
        <div class="intro-top">
          <img src="./assets/deliver-assets-mark.png" class="brand-symbol" width="96" height="73" alt="Símbolo utilizado por DELIVER ASSETS en el diseño previo">
          <span class="intro-top__tag">PROYECTO<br>EN DESARROLLO</span>
        </div>
        <div class="intro-main">
          <p class="eyebrow">DELIVER ASSETS / DESSET</p>
          <h1 id="main-heading">COMERCIO<br>Y <span class="brand-word">LOGÍSTICA</span>.<br><span>UNA MISMA VISIÓN.</span></h1>
          <p class="intro-lead">Una identidad creada para conectar comercio, ciudad y movimiento.</p>
        </div>
        <div class="intro-bottom"><span>HUACHO · PERÚ<br>SEDE PREVISTA</span><button class="text-action" type="button" data-detail="project">CONOCER EL PROYECTO <span aria-hidden="true">↗</span></button></div>
      </section>

      <button class="tile tile--visual tile--button" type="button" data-detail="ecosystem" aria-label="Conocer la visión del ecosistema DELIVER ASSETS">
        <img src="./assets/roles-geometry-v2.svg" width="960" height="720" alt="Diagrama conceptual de la relación entre Customer, Business, Rider y Control">
        <span class="visual-statement"><span>NO SOLO ENTREGAMOS.</span><strong>MOVEMOS LA CIUDAD.</strong></span>
        <span class="role-legend" aria-hidden="true"><span class="role-legend--customer">CUSTOMER</span><span class="role-legend--business">BUSINESS</span><span class="role-legend--rider">RIDER</span><span class="role-legend--control">CONTROL</span></span>
        <span class="visual-caption">MOVIMIENTO / SISTEMA <span aria-hidden="true">↗</span></span>
      </button>

      <button class="tile tile--contact tile--button" type="button" data-detail="contact">
        <span class="tile-label">CONTACTO / 01</span>
        <span class="tile-title">CANALES OFICIALES<br>EN PREPARACIÓN.</span>
        <span class="tile-arrow" aria-hidden="true">↗</span>
      </button>

      <button class="tile tile--status tile--button" type="button" data-detail="status">
        <span class="tile-label">ESTADO</span>
        <span class="status-line"><span class="status-dot" aria-hidden="true"></span> EN DESARROLLO</span>
        <span class="status-plus" aria-hidden="true">+</span>
      </button>

      <button class="tile tile--theme tile--button" id="themeButton" type="button" aria-label="Activar el modo oscuro" aria-pressed="false">
        <span class="theme-symbol" aria-hidden="true">☼</span>
        <span class="theme-caption">ACTIVAR MODO OSCURO.</span>
        <span class="tile-arrow" aria-hidden="true">↗</span>
      </button>

      <button class="tile tile--services tile--button" type="button" data-detail="services">
        <span class="tile-label">SERVICIOS / VISIÓN</span>
        <span class="tile-title">PEDIDOS<br>Y ENTREGAS.</span>
        <span class="tile-sub tile-sub--services">Conexión prevista entre comercios, pedidos y entregas.</span>
        <span class="tile-arrow" aria-hidden="true">↗</span>
      </button>

      <button class="tile tile--company tile--button" type="button" data-detail="company">
        <span class="tile-label">EMPRESA</span>
        <span class="tile-title tile-title--small">IDENTIDAD.</span>
        <span class="tile-arrow" aria-hidden="true">↗</span>
      </button>

      <button class="tile tile--journal tile--button" type="button" data-detail="evidence">
        <span class="tile-label">DOCUMENTACIÓN / ESTADO</span>
        <span class="tile-title">DECISIONES,<br>EVIDENCIA Y PROCESO.</span>
        <span class="mini-strip" aria-hidden="true"><span>01<br>PLAN</span><span>02<br>DISEÑO</span><span>03<br>PRUEBAS</span></span>
        <span class="tile-arrow" aria-hidden="true">↗</span>
      </button>

      <button class="tile tile--model tile--button" type="button" data-detail="model">
        <span class="tile-label">MODELO COMERCIAL</span>
        <span class="tile-title">COBRO<br>POR ENVÍO.</span>
        <span class="tile-sub">Modelo previsto. Operación comercial únicamente mediante la aplicación.</span>
        <span class="tile-arrow" aria-hidden="true">↗</span>
      </button>

      <button class="tile tile--apps tile--button" type="button" data-detail="apps">
        <span class="tile-label">ECOSISTEMA DIGITAL</span>
        <span class="tile-title">CUATRO ROLES.<br>UNA ARQUITECTURA.</span>
        <span class="app-strip" aria-hidden="true"><span>CU</span><span>BU</span><span>RI</span><span>CO</span></span>
        <span class="tile-arrow" aria-hidden="true">↗</span>
      </button>
    </main>

    <nav class="mobile-nav" aria-label="Vistas de la página">
      <button type="button" data-view-button="home" aria-current="page">INICIO</button>
      <button type="button" data-view-button="sections">EXPLORAR</button>
    </nav>
  </div>

  <dialog class="detail-dialog" id="detailDialog" aria-labelledby="detailTitle" aria-describedby="detailBody">
    <div class="dialog-shell">
      <div class="dialog-top"><span>DELIVER ASSETS / INFORMACIÓN</span><form method="dialog"><button type="submit" class="close-button" aria-label="Cerrar información">×</button></form></div>
      <div class="dialog-content"><p class="dialog-eyebrow" id="detailKicker"></p><h2 id="detailTitle"></h2><p id="detailBody"></p><ul id="detailPoints"></ul></div>
      <div class="dialog-bottom"><span>PROYECTO EN PREPARACIÓN</span><button type="button" id="dialogBack">VOLVER ↗</button></div>
    </div>
  </dialog>
</body>
</html>
